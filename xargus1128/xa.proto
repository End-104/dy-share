syntax = "proto3";

message GenerateObj {
  int32 magic = 1;
  int32 version = 2;
  int64 random = 3;
  string msAppId = 4;
  string deviceId = 5;
  string licenseId = 6;
  string appVersion = 7;
  string sdkVersionStr = 8;
  int32 sdkVersion = 9;
  bytes envCode = 10;
  int32 platform = 11;
  int64 createTime = 12;
  bytes bodyHash = 13;
  bytes queryHash = 14;
  ActionRecord actionRecord = 15;
  string secDeviceToken = 16;
  int64 isAppLicense = 17;
  bytes pskHash = 18;
  bytes pskCalHash = 19;
  string pskVersion = 20;
  int32 callType = 21;
  int32 mode_ = 22;
  int32 memoizedIsInitialized = 23;
  UnknownFields unknownFields = 24;
  int32 memoizedSize = 25;
  int32 memoizedHashCode = 26;
}

message Fields {
}

message UnknownFields {
  Fields fields = 1;
}

message ActionRecord {
  int32 signCount = 1;
  int32 reportCount = 2;
  int32 settingCount = 3;
  int32 reportFailCount = 4;
  int32 memoizedIsInitialized = 5;
  UnknownFields unknownFields = 6;
  int32 memoizedSize = 7;
  int32 memoizedHashCode = 8;
}

message PskHash {
  repeated string bytes = 1;
  int32 hash = 2;
}

message PskCalHash {
  repeated string bytes = 1;
  int32 hash = 2;
}
